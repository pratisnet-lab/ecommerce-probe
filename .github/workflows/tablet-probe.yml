name: Tablet Probe
on:
  workflow_dispatch:
  schedule:
    - cron: '0 23 * * *' # 02:00 Türkiye, following calendar day
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run probe
        run: python -m probe.main
      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: tablet-probe
          path: |
            probe/output/products.json
            probe/reports/probe_report.md
