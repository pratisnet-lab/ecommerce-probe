name: Connectivity smoke test
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'probe/**'
      - '.github/workflows/connectivity-smoke.yml'
permissions:
  contents: read
jobs:
  connectivity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check 13 sites and at most 3 product URLs each
        run: python -m probe.connectivity
      - name: Show site results in job summary
        run: python -m probe.smoke_summary
      - name: Upload connectivity report
        uses: actions/upload-artifact@v4
        with:
          name: connectivity-smoke
          path: probe/output/connectivity.json
