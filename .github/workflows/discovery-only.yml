name: Phase 1 - iPad discovery only
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'probe/discovery_only.py'
      - '.github/workflows/discovery-only.yml'
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test site access and iPad category discovery only
        run: python -m probe.discovery_only --max-pages 60
      - name: Upload discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-discovery
          path: probe/output/discovery_only.json
